[package]
name = "openpaperdesign-serve"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Loopback server that lets a browser edit one paper-rs project folder with revision-checked saves"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "openpaperdesign-serve"
path = "src/main.rs"

# The openpaperdesign plugin's MCP server (stdio); see plugin/openpaperdesign/.
[[bin]]
name = "openpaperdesign-mcp"
path = "src/bin/openpaperdesign-mcp.rs"

[lib]
path = "src/lib.rs"

# Requirements and features match the root package where shared.
[dependencies]
paper-rs = { path = "../.." }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# process + io-util: the sidebar home's read-only native project inventory (`codex app-server`).
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-std", "io-util", "process"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
getrandom = "0.3"
# Same requirements and features as the root package (MCP server over streamable HTTP).
rmcp = { version = "3.5.1", default-features = false, features = ["server", "base64", "transport-streamable-http-server", "transport-io", "client", "transport-streamable-http-client-reqwest"] }
# The XML parser usvg uses: inline SVG is checked with the same parser before it reaches usvg.
roxmltree = "0.21"
tower = "0.5"
# Same requirement and features as the root package: the app library decodes the images of an
# imported or exported canvas file without registering them in upstream's process-wide registry.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Same as the root package's dev-dependency: drives the stdio launcher as a child process.
rmcp = { version = "3.5.1", default-features = false, features = ["transport-child-process"] }
http-body-util = "0.1"
